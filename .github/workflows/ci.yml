name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm ts-check
      - run: pnpm build
        env:
          LLM_API_KEY: ci-placeholder

  docs-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: docs-guard (ADR-0005)
        env:
          DOCS_GUARD_BASE: origin/${{ github.base_ref }}
          DOCS_GUARD_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: pnpm docs:guard
